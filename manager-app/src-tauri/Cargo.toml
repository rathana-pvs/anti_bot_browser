[package]
name = "isolated-browser-manager"
version = "1.1.4"
description = "Isolated Browser Manager for Facebook Automation"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2.4.1"
tauri-plugin-updater = "2.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "multipart", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
