[package]
name = "isolated-browser-manager"
version = "1.0.0"
description = "Isolated Browser Manager for Facebook Automation"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
