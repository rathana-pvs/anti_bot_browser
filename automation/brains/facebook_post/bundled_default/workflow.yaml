schema_version: 1
brain_api_version: 1
workflow_id: facebook_post

# Each state is one engine step (FacebookPostTask._step_<name>). The engine
# follows on_success from initial_state and runs the steps in that order; the
# chain must match the engine's step list exactly. Optional steps such as
# attach_media and review_next pass through when they do not apply.

limits:
  max_steps: 60
  max_runtime_seconds: 300
  max_recovery_attempts: 3

initial_state: preflight

states:
  preflight:
    actions:
      - capability: observe_screen
    on_success: open_composer
    on_failure: failed_safe

  open_composer:
    actions:
      - capability: click_candidate
        target: composer_entry
    on_success: attach_media
    on_failure: failed_safe

  attach_media:
    actions:
      - capability: select_media
        input: media_path
        when: media_present
    on_success: enter_caption
    on_failure: failed_safe

  enter_caption:
    actions:
      - capability: type_text
        target: caption_input
        input: caption
    on_success: review
    on_rejected: operator_review
    on_failure: failed_safe

  review:
    actions:
      - capability: observe_screen
    on_success: select_template
    on_rejected: operator_review

  select_template:
    actions:
      - capability: find_template
    on_success: review_next
    on_rejected: operator_review

  review_next:
    actions:
      - capability: click_candidate
        target: next_button
        when: template_uses_review
    on_success: publish
    on_failure: failed_safe

  publish:
    actions:
      - capability: request_publish
        target: publish_button
    on_success: verify
    on_rejected: operator_review
    on_failure: failed_safe

  verify:
    actions:
      - capability: verify_publication
    on_success: finish
    on_uncertain: uncertain
    on_failure: uncertain

  finish:
    actions:
      - capability: observe_screen
    on_success: completed
    on_failure: uncertain
