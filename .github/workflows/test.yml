name: Test

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: manager-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: manager-app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Upload tested dashboard build
        uses: actions/upload-artifact@v4
        with:
          name: tested-dashboard
          path: manager-app/dist/
          if-no-files-found: error
          retention-days: 1

  python:
    needs: frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download tested dashboard build
        uses: actions/download-artifact@v4
        with:
          name: tested-dashboard
          path: manager-app/dist/
      - name: Verify dashboard build is present
        run: test -s manager-app/dist/index.html
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-test.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-test.txt
      - name: Backend tests
        run: python -m pytest backend/tests -q
      - name: Automation tests
        working-directory: automation
        run: python -m unittest discover -s tests
