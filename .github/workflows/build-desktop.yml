name: Build Desktop App

# Ordinary pushes are development only. Tags create drafts, never publish them.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: Platform to build (artifacts only, no release)
        required: true
        default: all
        type: choice
        options: [linux, all]

permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate synchronized version and deliberate tag
        shell: bash
        run: |
          node scripts/release-version.mjs check
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            node scripts/validate-release-tag.mjs "$GITHUB_REF_NAME"
          fi
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2t64 ffmpeg
          python -m pip install -r requirements-test.txt pyinstaller
      - name: Install frontend dependencies
        working-directory: manager-app
        run: npm ci
      - name: Run frontend and release-tool tests
        working-directory: manager-app
        run: npm test && npm run build
      - name: Run backend and automation release gates
        if: matrix.platform == 'linux'
        env:
          PYTHONPATH: .:automation
        run: |
          python -m pytest backend/tests -q
          cd automation && python -m unittest discover -s tests
      - name: Run Rust tests
        working-directory: manager-app/src-tauri
        run: cargo test --locked
      - name: Build platform bundles
        if: github.event_name == 'push' || inputs.target == matrix.platform || inputs.target == 'all'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BUNDLES: ${{ matrix.bundles }}
          CI: true
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Configure TAURI_SIGNING_PRIVATE_KEY before tagging a release.'; exit 1; }
            cd manager-app
            npm run tauri:build -- --bundles "$BUNDLES" --config '{"bundle":{"createUpdaterArtifacts":true}}'
            for package in src-tauri/target/release/bundle/deb/*.deb; do
              npm run tauri -- signer sign --app-version "$(tr -d '[:space:]' < ../VERSION)" "$package"
            done
          else
            cd manager-app
            npm run tauri:build -- --bundles "$BUNDLES"
          fi
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' || inputs.target == matrix.platform || inputs.target == 'all'
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            manager-app/src-tauri/target/release/bundle/deb/*.deb
            manager-app/src-tauri/target/release/bundle/deb/*.sig
            manager-app/src-tauri/target/release/bundle/appimage/*.AppImage
            manager-app/src-tauri/target/release/bundle/appimage/*.sig
          if-no-files-found: error

  draft-release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-input
          merge-multiple: true
      - name: Assemble complete signed update metadata
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          node scripts/assemble-release.mjs release-input release-output
      - name: Create or refresh a draft (never overwrite a published release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true || { echo 'Release is already published; refusing to replace it.'; exit 1; }
          else
            prerelease=()
            if [[ "$RELEASE_TAG" == *-* ]]; then prerelease+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --draft "${prerelease[@]}" --title "Isolated Browser Manager $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" release-output/* --clobber
