name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Platform to build'
        required: true
        default: 'windows'
        type: choice
        options:
          - 'windows'
          - 'linux'
          - 'all'

jobs:
  build-windows:
    if: github.event_name == 'push' || github.event.inputs.target == 'windows' || github.event.inputs.target == 'all'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build Python Sidecar Binary
        shell: bash
        run: |
          mkdir -p manager-app/src-tauri/binaries
          pyinstaller --name backend_server --onefile --clean --noconfirm --distpath manager-app/src-tauri/binaries --add-data "automation/brains;automation/brains" --add-data "automation/templates;automation/templates" backend/main.py

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        working-directory: manager-app
        run: npm install

      - name: Build Tauri Desktop Application (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: manager-app
          tagName: v__VERSION__
          releaseName: 'Anti-Bot Browser Manager v__VERSION__'
          releaseBody: 'Automated desktop build for Windows.'
          releaseDraft: true
          prerelease: true

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-installer
          path: |
            manager-app/src-tauri/target/release/bundle/nsis/*.exe
            manager-app/src-tauri/target/release/bundle/msi/*.msi
            manager-app/src-tauri/target/release/*.exe
          if-no-files-found: warn

  build-linux:
    if: github.event_name == 'push' || github.event.inputs.target == 'linux' || github.event.inputs.target == 'all'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build Python Sidecar Binary
        run: |
          mkdir -p manager-app/src-tauri/binaries
          pyinstaller --name backend_server --onefile --clean --noconfirm --distpath manager-app/src-tauri/binaries --add-data "automation/brains:automation/brains" --add-data "automation/templates:automation/templates" backend/main.py

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install npm dependencies
        working-directory: manager-app
        run: npm install

      - name: Build Tauri Desktop Application (Linux)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: manager-app
          tagName: v__VERSION__
          releaseName: 'Anti-Bot Browser Manager v__VERSION__'
          releaseBody: 'Automated desktop build for Linux.'
          releaseDraft: true
          prerelease: true

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-desktop-package
          path: |
            manager-app/src-tauri/target/release/bundle/deb/*.deb
            manager-app/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
