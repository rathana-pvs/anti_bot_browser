services:
  redroid:
    # Android 12 image fully compatible with ws-scrcpy
    image: ${REDROID_IMAGE:-redroid/redroid:12.0.0-latest}
    container_name: redroid-standalone
    privileged: true
    restart: unless-stopped
    ports:
      - "5555:5555"
    volumes:
      - ./data:/data
    devices:
      - /dev/dri:/dev/dri
    command:
      - "androidboot.redroid_width=720"
      - "androidboot.redroid_height=1280"
      - "androidboot.redroid_dpi=320"
      - "androidboot.redroid_gpu_mode=auto"
      - "androidboot.redroid_enable_input_subsys=1"

  ws-scrcpy:
    image: scavin/ws-scrcpy:latest
    container_name: ws-scrcpy-standalone
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ADB_DEVICES=redroid:5555
    depends_on:
      - redroid
